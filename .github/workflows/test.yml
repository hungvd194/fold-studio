name: Fold Studio tests
on:
  push:
    branches: [main, phase-1-safety-trust]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node tests/verify-export.cjs
