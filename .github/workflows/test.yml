name: Fold Studio tests
on:
  push:
    branches: [main, phase-1-safety-trust, phase-2-easy-mode, phase-3-visual-guidance, remove-fold-preview]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/app.js
      - run: node --check dist/workspace.js
      - run: node --check dist/easy-mode.js
      - run: npm test
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
      # Export verifier requires three user-generated files; run it during export acceptance.
